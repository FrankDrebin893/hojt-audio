name: Approve specs

# The approval list: one pinned issue "Specs to approve" with a box per spec waiting for the
# owner (scripts/approvals.sh). The owner approves by ticking boxes (or "Approve all"), by a
# comment `/approve all` or `/approve 130 133`, or by `/approve` on a spec's own issue. Only the
# owner's tick or comment approves: anyone else's is ignored. Every approval gets a comment that
# names this run, which `/next` checks (the label itself is set by the workflow's token).
on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:
  issues:
    types: [edited, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: approvals
  cancel-in-progress: false

permissions:
  issues: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}

jobs:
  # Ticks on the list, by the owner
  ticked:
    if: >-
      github.event_name == 'issues' && github.event.action == 'edited' &&
      github.actor == 'FrankDrebin893' &&
      contains(github.event.issue.labels.*.name, 'approval-list')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/approvals.sh ticked

  # `/approve ...` in a comment, by the owner, on an issue (not a pull request)
  comment:
    if: >-
      github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
      github.event.comment.user.login == 'FrankDrebin893' &&
      startsWith(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          BODY: ${{ github.event.comment.body }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          args="$(head -1 <<< "$BODY" | sed 's/^\/approve//' | tr -cs '0-9a-z#' ' ')"
          if [ -z "${args// /}" ]; then
            args="$ISSUE"
          fi
          # shellcheck disable=SC2086
          scripts/approvals.sh approve $args

  # Anything else that can change the list: write it again
  list:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action != 'edited' &&
       !contains(github.event.issue.labels.*.name, 'approval-list'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/approvals.sh list
