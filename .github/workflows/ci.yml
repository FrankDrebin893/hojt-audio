name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A change that only touches docs, the page, screenshots or markdown cannot change what the
  # checks below test, so they skip their steps. The jobs themselves still run (and pass in
  # seconds): `main`'s protection requires "Format and clippy" and "Test (<os>)" by name, and
  # a job skipped as a whole would leave a required name missing or pending.
  # Anything in doubt (no base to compare with, a failed diff) counts as code.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      skills: ${{ steps.diff.outputs.skills }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is it only docs?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          skills=false
          if files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null || git diff --name-only "$BASE" "$HEAD" 2>/dev/null) && [ -n "$files" ]; then
            # Light: the page and its sources, markdown, `.claude/` (settings and the retro log),
            # the licence and the issue forms. Everything else is code. The skills are light too,
            # but `xtask`'s tests read them (the approval rules), so a change to them runs
            # those alone, on Linux (the `skills` output), not the whole workspace.
            rest=$(printf '%s\n' "$files" | grep -vE '^(site/|site-sources/|site-design/|\.claude/|\.github/ISSUE_TEMPLATE/|LICENSE$|piano/LICENSE$)' | grep -vE '\.md$' || true)
            if [ -z "$rest" ]; then code=false; fi
            if printf '%s\n' "$files" | grep -qE '^\.claude/skills/'; then skills=true; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          echo "Changed files:"; printf '%s\n' "$files"
          echo "Heavy checks needed: $code"

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # mesa-vulkan-drivers: lavapipe, the software Vulkan driver the editors' snapshot
      # tests draw with (suite_common::ui::snapshot), on a runner without a graphics card
      - name: Install Linux packages
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'

      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace --locked

      # Only the skills changed: the tests that read them (approval rules, release cycle)
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code != 'true' && needs.changes.outputs.skills == 'true' && runner.os == 'Linux'
      - name: Test the skills' guards
        if: needs.changes.outputs.code != 'true' && needs.changes.outputs.skills == 'true' && runner.os == 'Linux'
        # A subset of `cargo test --workspace`, which scripts/check.sh runs; a block, so
        # check_mirrors_ci does not ask the script for the same step twice
        run: |
          cargo test -p xtask --locked

      # The clippers' two-at-a-time path is only compiled in optimised x86-64 builds, and the
      # bass's cost bound only means something optimised
      - name: Test the amp and the bass, optimised
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p amp -p bass --release --locked

      # The Linux zip's install.sh into a temporary HOME, and out again (shellcheck on it too)
      - name: Test the Linux install script
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: bash scripts/test-linux-install.sh

  lint:
    name: Format and clippy
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev mesa-vulkan-drivers

      # Pinned, so a new Rust release with new lints does not fail every pull request.
      # Moving it on is a change of its own, with the lints it brings fixed
      - uses: dtolnay/rust-toolchain@1.99.1
        if: needs.changes.outputs.code == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'

      - name: Script modes
        if: needs.changes.outputs.code == 'true'
        run: bash scripts/check.sh modes

      - name: Format
        if: needs.changes.outputs.code == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
