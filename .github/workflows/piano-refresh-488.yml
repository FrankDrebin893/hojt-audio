name: Piano refresh 488

# Temporary, removed in the next commit: re-renders the screenshot references after the rename.
on:
  push:
    branches: [feature/488-piano-hojte-piano]
    paths: ['.github/workflows/piano-refresh-488.yml']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - run: dotnet run --project piano/tools/readme-screenshots/ReadmeScreenshots.csproj -c Release
      - name: Commit the references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/piano/screenshots
          git status --short
          git commit -m "Piano viz: re-render the screenshots for the Højte Piano title bar" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01P9yWjzDctpW4tR428F4tVc"
          git push origin HEAD:feature/488-piano-hojte-piano
