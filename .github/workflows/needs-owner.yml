name: Needs owner

# An issue labelled `needs:rasmus` waits for the owner (an answer, a pick, a listen) and is listed
# on the pinned "Specs to approve" under "Waiting on you" (scripts/approvals.sh). When the owner
# answers on the issue, the label comes off, and `/next` can pick the issue up again with his
# answer. The agent's GitHub tools act in his name, so a comment counts only if it does not end
# with the agent's footer ("Generated by [Claude Code]").
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  answered:
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'FrankDrebin893' &&
      !contains(github.event.comment.body, 'Generated by [Claude Code]') &&
      !startsWith(github.event.comment.body, '/approve') &&
      contains(github.event.issue.labels.*.name, 'needs:rasmus')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label needs:rasmus
          scripts/approvals.sh list
