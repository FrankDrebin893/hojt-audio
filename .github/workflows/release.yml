name: Release

# A tag vX.Y.Z builds the plugins for the three systems and publishes them as a GitHub release.
# Run by hand, or from a pull request that touches the packaging or the installer, it only builds:
# the zips and the Windows installer are then under the run's artifacts, and the installer has been
# installed, upgraded and uninstalled on the runner.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.sh
      - scripts/build-installer.sh
      - scripts/build-standalones.sh
      - scripts/smoke-standalones.ps1
      - scripts/checksums.sh
      - installer/**

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: macos, os: macos-latest }
          - { name: linux, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Test the amp and the bass, optimised
        run: cargo test -p amp -p bass --release --locked

      - name: Bundle
        if: runner.os != 'macOS'
        run: cargo xtask bundle -p pitch_shifter -p drums -p amp -p bass -p bells -p pad --release

      # One binary for Intel and Apple Silicon. The bundler signs it ad hoc
      - name: Bundle (universal)
        if: runner.os == 'macOS'
        run: cargo xtask bundle-universal -p pitch_shifter -p drums -p amp -p bass -p bells -p pad --release

      # Every bundle carries its plugin's artwork, or it was not built from these sources
      - name: Check the artwork
        run: cargo xtask check-art

      - name: Package
        shell: bash
        run: bash scripts/package.sh ${{ matrix.name }}

      # HojtDSP-linux.zip, with install.sh, is made by the Package step. This packs stand-in bundles
      # the same way, installs them into a temporary HOME and uninstalls them again
      # (shellcheck on install.sh as well) before anything is published
      - name: Test the Linux install script
        if: runner.os == 'Linux'
        run: bash scripts/test-linux-install.sh

      # The six standalone programs (WASAPI and the dummy backend; ASIO stays a build by hand),
      # each started for a few seconds with the dummy backend to see that its window opens
      - name: Build the standalone programs
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/build-standalones.sh

      - name: Start the standalone programs
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke-standalones.ps1

      # The Windows installer, from the bundles just built. Unsigned: to sign, set
      # HOJT_SIGN_COMMAND (a command that signs the file it is given last) in this step's env
      - name: Build the installer
        if: runner.os == 'Windows'
        shell: bash
        # env:
        #   HOJT_SIGN_COMMAND: <a command that signs the file it is given last>
        run: bash scripts/build-installer.sh

      # Installs it silently to temp folders, upgrades it over an older build, uninstalls it, and
      # fails if a file is wrong or left behind. The previous release's zips are the older build
      - name: Test the installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force prev | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern '*-windows.zip' --dir prev --clobber
          if ($LASTEXITCODE -ne 0) { Write-Host 'No previous release to upgrade from: the test makes up an older build' }
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          & installer/test-installer.ps1 -Installer dist/HojtDSP-Setup.exe -BundleDir target/bundled -Version $version -PreviousZipDir prev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish
    # Only a pushed tag publishes. A run by hand builds, also when it is started on a tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^version = \"$version\"" Cargo.toml; then
            echo "Tag $GITHUB_REF_NAME does not match the version in Cargo.toml" >&2
            exit 1
          fi
          awk -v v="$version" '
            /^## / { on = ($2 == v); next }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      # One SHA256SUMS.txt for every file of the release (the zips and the installer)
      - name: Checksums
        run: bash scripts/checksums.sh dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.exe dist/SHA256SUMS.txt \
            --title "HØJT DSP ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
