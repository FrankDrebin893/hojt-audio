[workspace]
resolver = "2"
members = ["xtask", "crates/*", "plugins/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Rasmus Højte"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Our fork: upstream 28b149e plus one commit, `Vst3Plugin::VST3_INFINITE_TAIL` (branch
# hojt-vst3-infinite-tail; tag hojt-1 keeps the commit, never delete it). VST3 hosts that
# read the tail length once, before the first block, would otherwise see 0 and may cut
# delay and reverb tails (#20)
nih_plug = { git = "https://github.com/FrankDrebin893/nih-plug.git", rev = "f7b1196b266961c70528c7bb3737b9069c13b238" }
nih_plug_egui = { git = "https://github.com/FrankDrebin893/nih-plug.git", rev = "f7b1196b266961c70528c7bb3737b9069c13b238" }
nih_plug_xtask = { git = "https://github.com/FrankDrebin893/nih-plug.git", rev = "f7b1196b266961c70528c7bb3737b9069c13b238" }
# Only for its `windows_keyboard_workaround` feature, which nih_plug_egui does not turn on:
# a plugin's editor is a child window of the host's, and on Windows nothing ever gives it the
# keyboard focus, so a name typed on a label tape was never heard. With the feature on,
# egui-baseview takes the focus for the window whenever a widget of ours asks egui for the
# keyboard, which only the row that names a preset bank does. Same git revision as the one
# nih_plug_egui depends on, so it is the same crate and the features are added together
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "ec70c3fe6b2f070dcacbc22924431edbe24bd1c0", features = ["windows_keyboard_workaround"] }
suite_common = { path = "crates/suite_common" }

[profile.release]
lto = "thin"
strip = "symbols"

# The tests play seconds of sound through the DSP, hundreds of times: unoptimised the amp's alone
# took 25 minutes on CI, at level 1 under two. Debug assertions and overflow checks stay on, so a
# test still catches what it caught; only `--release` turns them off (and compiles the clippers'
# SSE2 path, plugins/amp/src/dsp/pair.rs). Line tables keep the line numbers of a backtrace.
# For a quick unoptimised build of one test: CARGO_PROFILE_TEST_OPT_LEVEL=0 cargo test ...
[profile.test]
opt-level = 1
debug = "line-tables-only"

# What the tests and the sound reports run when they have to be optimised (`cargo test --profile
# optimised`): `release` without the link-time optimisation. Each test binary is linked on its own,
# and with thin LTO each link optimised egui, wgpu and the rest of the snapshot harness again: the
# amp's and the bass's took 98 s to build after an edit, and take 25 s this way. The same code is
# compiled (no debug assertions, so the clippers' SSE2 path) and the reports come out the same to
# the byte. What ships is still built with `--release`.
[profile.optimised]
inherits = "release"
lto = false

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# Lints that clash with how DSP code is written here. Every crate takes these (`[lints]`).
[workspace.lints.clippy]
# Filter coefficients and polynomial fits are kept to the digits they were designed with;
# changing one changes the output's bits
excessive_precision = "allow"
approx_constant = "allow"
# DSP loops index several buffers with one counter
needless_range_loop = "allow"
# Noise generators have a `next` that never ends, so they are not iterators
should_implement_trait = "allow"
