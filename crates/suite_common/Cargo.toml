[package]
name = "suite_common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
nih_plug = { workspace = true }
nih_plug_egui = { workspace = true }
# Named only to turn its `windows_keyboard_workaround` on for every editor (see the root
# Cargo.toml). Nothing here uses it: egui comes through nih_plug_egui
egui-baseview = { workspace = true }
png = "0.17"
# The update check (`update`): serde for the persisted state and the releases JSON, and a small
# blocking HTTPS client with no async runtime. minreq with rustls was the smallest of the
# candidates measured (14 crates and 1.9 MB in a test binary, against 25 and 2.9 MB for ureq 3 and
# 65 and 2.8 MB for ureq 2); the choice is on issue #306
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minreq = { version = "2", default-features = false, features = ["https-rustls"] }

# Draws an editor off screen into a picture, for the snapshot tests of `ui::snapshot`. The
# release matches egui's (0.31.1, through nih_plug_egui): one egui in the tree. Linux only, where
# the references are drawn: on Windows its wgpu 24 does not build next to nih-plug's cpal, which
# holds the `windows` crate at 0.54 while wgpu-hal's DirectX 12 backend needs 0.58
[target.'cfg(target_os = "linux")'.dependencies]
egui_kittest = { version = "=0.31.1", features = ["wgpu", "snapshot"], optional = true }

[features]
# `ui::snapshot`, for the plugins' tests only: named in their dev-dependencies, never shipped
snapshot = ["dep:egui_kittest"]

[dev-dependencies]
# The pitch shifter's render tests write WAV files
hound = "3.5"

[lints]
workspace = true
