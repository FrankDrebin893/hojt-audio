[package]
name = "amp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

# Runs the plugin as a program, for working on the editor without a DAW:
# cargo run -p amp --features standalone
[features]
standalone = ["nih_plug/standalone", "dep:cpal"]
# ASIO as a driver of the standalone program (Windows). Needs the Steinberg ASIO SDK at build
# time: set CPAL_ASIO_DIR to its folder. Not part of the workspace's own checks
asio = ["standalone", "nih_plug/asio"]

[[bin]]
name = "amp_standalone"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
nih_plug = { workspace = true }
nih_plug_egui = { workspace = true }
suite_common = { workspace = true }
# Reads the player's own cabinets (WAV files)
hound = "3.5"
# Lists the standalone program's audio devices (the version nih-plug uses)
cpal = { version = "0.15", optional = true }

[build-dependencies]
# The HØJT icon of the standalone program's exe (Windows; a no-op elsewhere)
embed-resource = "3"

[dev-dependencies]
# The snapshot tests of the editor: suite_common::ui::snapshot
suite_common = { workspace = true, features = ["snapshot"] }

[lints]
workspace = true
