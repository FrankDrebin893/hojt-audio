[package]
name = "amp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

# Runs the plugin as a program, for working on the editor without a DAW:
# cargo run -p amp --features standalone
[features]
standalone = ["nih_plug/standalone", "dep:cpal"]

[[bin]]
name = "amp_standalone"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
nih_plug = { workspace = true }
nih_plug_egui = { workspace = true }
suite_common = { workspace = true }
# Reads the player's own cabinets (WAV files)
hound = "3.5"
# Lists the standalone program's audio devices (the version nih-plug uses)
cpal = { version = "0.15", optional = true }

[dev-dependencies]
# The snapshot tests of the editor: suite_common::ui::snapshot
suite_common = { workspace = true, features = ["snapshot"] }

[lints]
workspace = true
